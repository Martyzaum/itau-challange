services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - "8080:8080"
    environment:
      DYNAMODB_ENDPOINT: http://toxiproxy:8666
      DYNAMODB_REGION: us-east-1
      ACCOUNT_BALANCES_TABLE_NAME: AccountBalances
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_CONSUMER_GROUP_ID: balance-transaction-consumer
      TRANSACTIONS_TOPIC: transacoes-financeiras-processadas
      TRANSACTIONS_DLT_TOPIC: transacoes-financeiras-processadas.DLT
      TRANSACTIONS_INGESTION_ENABLED: ${TRANSACTIONS_INGESTION_ENABLED:-true}
      TRANSACTIONS_RETRY_MAX_ATTEMPTS: ${TRANSACTIONS_RETRY_MAX_ATTEMPTS:-3}
      DYNAMODB_CONSISTENT_READ: ${DYNAMODB_CONSISTENT_READ:-true}
      BALANCE_CACHE_ENABLED: ${BALANCE_CACHE_ENABLED:-true}
      BALANCE_CACHE_REDIS_HOST: redis
      BALANCE_CACHE_REDIS_PORT: 6379
      API_AUTH_ENABLED: ${API_AUTH_ENABLED:-true}
      API_AUTH_KEYS: ${API_AUTH_KEYS:-}
      API_AUTH_KEYS_FILE: ${API_AUTH_KEYS_FILE:-classpath:api-keys.json}
      API_AUTH_HEADER: ${API_AUTH_HEADER:-X-API-Key}
      API_RATE_LIMIT_ENABLED: ${API_RATE_LIMIT_ENABLED:-false}
      API_RATE_LIMIT_REQUESTS_PER_MINUTE: ${API_RATE_LIMIT_REQUESTS_PER_MINUTE:-120}
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"
      MANAGEMENT_TRACING_ENABLED: "false"
      MANAGEMENT_LOGGING_EXPORT_OTLP_ENABLED: "false"
    depends_on:
      toxiproxy-config:
        condition: service_completed_successfully
      dynamodb-seed:
        condition: service_completed_successfully
      redpanda-seed:
        condition: service_completed_successfully
      redis:
        condition: service_started

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  dynamodb:
    image: amazon/dynamodb-local:3.3.0
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    working_dir: /home/dynamodblocal
    expose:
      - "8000"

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host", "0.0.0.0"]
    depends_on:
      - dynamodb
    ports:
      - "8474:8474"
      - "8000:8666"

  toxiproxy-config:
    image: curlimages/curl:8.12.1
    depends_on:
      - toxiproxy
    volumes:
      - ./infra/toxiproxy:/toxiproxy:ro
    entrypoint: ["/bin/sh", "/toxiproxy/configure.sh"]

  dynamodb-seed:
    image: amazon/aws-cli:2.36.8
    depends_on:
      toxiproxy-config:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
      DYNAMODB_ENDPOINT_URL: http://toxiproxy:8666
      ACCOUNT_BALANCES_TABLE_NAME: AccountBalances
    volumes:
      - ./infra/dynamodb:/dynamodb-seed:ro
    entrypoint: ["/bin/bash", "/dynamodb-seed/seed.sh"]

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:5.3.4
    depends_on:
      toxiproxy-config:
        condition: service_completed_successfully
    environment:
      DYNAMO_ENDPOINT: http://toxiproxy:8666
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      HOST: 0.0.0.0
      PORT: 8001
    ports:
      - "8001:8001"

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.14
    hostname: redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    ports:
      - "19092:19092"

  redpanda-seed:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.14
    depends_on:
      - redpanda
    environment:
      REDPANDA_BROKERS: redpanda:9092
      TRANSACTIONS_TOPIC: transacoes-financeiras-processadas
      TRANSACTIONS_DLT_TOPIC: transacoes-financeiras-processadas.DLT
      TRANSACTIONS_RETRY_MAX_ATTEMPTS: "3"
      TRANSACTIONS_TOPIC_PARTITIONS: "3"
    volumes:
      - ./infra/redpanda:/redpanda-seed:ro
    entrypoint: ["/bin/bash", "-c", "/redpanda-seed/config.sh && /redpanda-seed/seed.sh"]

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.9.0
    depends_on:
      - redpanda
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    ports:
      - "8081:8080"
