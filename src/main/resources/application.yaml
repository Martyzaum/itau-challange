spring:
  application:
    name: itau-balance-api
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:balance-transaction-consumer}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

dynamodb:
  # Set for DynamoDB Local (default). Leave empty to use real AWS endpoint + default credential chain.
  endpoint: ${DYNAMODB_ENDPOINT:http://localhost:8000}
  region: ${DYNAMODB_REGION:us-east-1}
  account-balances-table-name: ${ACCOUNT_BALANCES_TABLE_NAME:AccountBalances}


transactions:
  topic-name: ${TRANSACTIONS_TOPIC:transacoes-financeiras-processadas}
  dlt-topic-name: ${TRANSACTIONS_DLT_TOPIC:transacoes-financeiras-processadas.DLT}
  retry:
    initial-interval-ms: ${TRANSACTIONS_RETRY_INITIAL_INTERVAL_MS:500}
    multiplier: ${TRANSACTIONS_RETRY_MULTIPLIER:2.0}
    max-interval-ms: ${TRANSACTIONS_RETRY_MAX_INTERVAL_MS:5000}
    max-attempts: ${TRANSACTIONS_RETRY_MAX_ATTEMPTS:3}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      service: balance-api
  otlp:
    metrics:
      export:
        # OTLP/HTTP metrics endpoint (OpenTelemetry Protocol).
        # Override with OTEL_EXPORTER_OTLP_ENDPOINT or MANAGEMENT_OTLP_METRICS_EXPORT_URL.
        enabled: ${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:true}
        url: ${MANAGEMENT_OTLP_METRICS_EXPORT_URL:${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics}
        step: ${MANAGEMENT_OTLP_METRICS_EXPORT_STEP:30s}

logging:
  # JSON logs (Logstash format) are collector-friendly for OpenTelemetry log pipelines.
  structured:
    format:
      console: logstash
