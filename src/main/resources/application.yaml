spring:
  application:
    name: itau-balance-api
  lifecycle:
    timeout-per-shutdown-phase: 30s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:balance-transaction-consumer}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      observation-enabled: true
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}
      ack-mode: ${KAFKA_LISTENER_ACK_MODE:batch}
    template:
      observation-enabled: true

dynamodb:
  endpoint: ${DYNAMODB_ENDPOINT:http://localhost:8000}
  region: ${DYNAMODB_REGION:us-east-1}
  account-balances-table-name: ${ACCOUNT_BALANCES_TABLE_NAME:AccountBalances}
  consistent-read: ${DYNAMODB_CONSISTENT_READ:true}
  api-call-timeout-ms: ${DYNAMODB_API_CALL_TIMEOUT_MS:5000}
  api-call-attempt-timeout-ms: ${DYNAMODB_API_CALL_ATTEMPT_TIMEOUT_MS:3000}
  read-bulkhead-max-concurrent: ${DYNAMODB_READ_BULKHEAD_MAX_CONCURRENT:64}
  read-bulkhead-timeout-ms: ${DYNAMODB_READ_BULKHEAD_TIMEOUT_MS:50}

resilience:
  circuitbreaker:
    failure-rate-threshold: ${RESILIENCE_CB_FAILURE_RATE_THRESHOLD:50}
    sliding-window-size: ${RESILIENCE_CB_SLIDING_WINDOW_SIZE:20}
    minimum-number-of-calls: ${RESILIENCE_CB_MINIMUM_NUMBER_OF_CALLS:10}
    wait-duration-in-open-state-ms: ${RESILIENCE_CB_WAIT_DURATION_IN_OPEN_STATE_MS:30000}
    permitted-number-of-calls-in-half-open-state: ${RESILIENCE_CB_PERMITTED_CALLS_IN_HALF_OPEN:5}

api:
  auth:
    enabled: ${API_AUTH_ENABLED:false}
    header: ${API_AUTH_HEADER:X-API-Key}
    keys: ${API_AUTH_KEYS:}
  rate-limit:
    enabled: ${API_RATE_LIMIT_ENABLED:false}
    requests-per-minute: ${API_RATE_LIMIT_REQUESTS_PER_MINUTE:120}

balance:
  cache:
    enabled: ${BALANCE_CACHE_ENABLED:false}
    key-prefix: ${BALANCE_CACHE_KEY_PREFIX:balance:account:}
    ttl-seconds: ${BALANCE_CACHE_TTL_SECONDS:300}
    redis:
      host: ${BALANCE_CACHE_REDIS_HOST:localhost}
      port: ${BALANCE_CACHE_REDIS_PORT:6379}
      timeout-ms: ${BALANCE_CACHE_REDIS_TIMEOUT_MS:200}

transactions:
  topic-name: ${TRANSACTIONS_TOPIC:transacoes-financeiras-processadas}
  dlt-topic-name: ${TRANSACTIONS_DLT_TOPIC:transacoes-financeiras-processadas.DLT}
  ingestion:
    enabled: ${TRANSACTIONS_INGESTION_ENABLED:true}
  retry:
    # Number of async retry topics (….retry-1..N). Hops are immediate (no consumer sleep).
    max-attempts: ${TRANSACTIONS_RETRY_MAX_ATTEMPTS:3}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      service: balance-api
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
    enabled: ${MANAGEMENT_TRACING_ENABLED:true}
  logging:
    export:
      otlp:
        enabled: ${MANAGEMENT_LOGGING_EXPORT_OTLP_ENABLED:false}
  otlp:
    metrics:
      export:
        enabled: ${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:true}
        step: ${MANAGEMENT_OTLP_METRICS_EXPORT_STEP:30s}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:http://localhost:4317}
          transport: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_TRANSPORT:grpc}
    metrics:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_METRICS_EXPORT_OTLP_ENDPOINT:http://localhost:4317}
    logging:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT:http://localhost:4317}
          transport: ${MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_TRANSPORT:grpc}

server:
  shutdown: graceful

logging:
  structured:
    format:
      console: logstash
