spring:
  application:
    name: itau-balance-api
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:balance-transaction-consumer}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      observation-enabled: true
    template:
      observation-enabled: true

dynamodb:
  endpoint: ${DYNAMODB_ENDPOINT:http://localhost:8000}
  region: ${DYNAMODB_REGION:us-east-1}
  account-balances-table-name: ${ACCOUNT_BALANCES_TABLE_NAME:AccountBalances}

balance:
  cache:
    enabled: ${BALANCE_CACHE_ENABLED:false}
    key-prefix: ${BALANCE_CACHE_KEY_PREFIX:balance:account:}
    ttl-seconds: ${BALANCE_CACHE_TTL_SECONDS:300}
    redis:
      host: ${BALANCE_CACHE_REDIS_HOST:localhost}
      port: ${BALANCE_CACHE_REDIS_PORT:6379}
      timeout-ms: ${BALANCE_CACHE_REDIS_TIMEOUT_MS:200}

transactions:
  topic-name: ${TRANSACTIONS_TOPIC:transacoes-financeiras-processadas}
  dlt-topic-name: ${TRANSACTIONS_DLT_TOPIC:transacoes-financeiras-processadas.DLT}
  retry:
    initial-interval-ms: ${TRANSACTIONS_RETRY_INITIAL_INTERVAL_MS:500}
    multiplier: ${TRANSACTIONS_RETRY_MULTIPLIER:2.0}
    max-interval-ms: ${TRANSACTIONS_RETRY_MAX_INTERVAL_MS:5000}
    max-attempts: ${TRANSACTIONS_RETRY_MAX_ATTEMPTS:3}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      service: balance-api
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
    enabled: ${MANAGEMENT_TRACING_ENABLED:true}
  logging:
    export:
      otlp:
        enabled: ${MANAGEMENT_LOGGING_EXPORT_OTLP_ENABLED:false}
  otlp:
    metrics:
      export:
        enabled: ${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:true}
        step: ${MANAGEMENT_OTLP_METRICS_EXPORT_STEP:30s}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:http://localhost:4317}
          transport: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_TRANSPORT:grpc}
    metrics:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_METRICS_EXPORT_OTLP_ENDPOINT:http://localhost:4317}
    logging:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT:http://localhost:4317}
          transport: ${MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_TRANSPORT:grpc}

logging:
  structured:
    format:
      console: logstash
