services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.1.2-alpine
    hostname: clickhouse
    restart: on-failure
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./infra/signoz/clickhouse-cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./infra/signoz/data/clickhouse/:/var/lib/clickhouse/
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "0.0.0.0:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      options:
        max-size: 50m
        max-file: "3"

  otel-collector-migrator-sync:
    image: signoz/signoz-schema-migrator:0.111.24
    command: ["sync", "--dsn=tcp://clickhouse:9000", "--up="]
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: "no"

  otel-collector-migrator-async:
    image: signoz/signoz-schema-migrator:0.111.24
    command: ["async", "--dsn=tcp://clickhouse:9000", "--up="]
    depends_on:
      clickhouse:
        condition: service_healthy
      otel-collector-migrator-sync:
        condition: service_completed_successfully
    restart: "no"

  query-service:
    image: signoz/query-service:0.69.0
    command:
      [
        "-config=/root/config/prometheus.yml",
        "--use-logs-new-schema=true",
        "--use-trace-new-schema=true",
      ]
    volumes:
      - ./infra/signoz/prometheus.yml:/root/config/prometheus.yml:ro
      - ./infra/signoz/dashboards:/root/config/dashboards:ro
      - ./infra/signoz/data/signoz/:/var/lib/signoz/
    environment:
      - ClickHouseUrl=tcp://clickhouse:9000
      - SIGNOZ_LOCAL_DB_PATH=/var/lib/signoz/signoz.db
      - DASHBOARDS_PATH=/root/config/dashboards
      - STORAGE=clickhouse
      - GODEBUG=netdns=go
      - TELEMETRY_ENABLED=false
      - DEPLOYMENT_TYPE=docker-standalone-amd
    depends_on:
      clickhouse:
        condition: service_healthy
      otel-collector-migrator-sync:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 12
    restart: on-failure

  frontend:
    image: signoz/frontend:0.69.0
    depends_on:
      query-service:
        condition: service_healthy
    ports:
      - "3301:3301"
    volumes:
      - ./infra/signoz/nginx-config.conf:/etc/nginx/conf.d/default.conf:ro
    restart: on-failure

  otel-collector:
    image: signoz/signoz-otel-collector:0.111.24
    command:
      [
        "--config=/etc/otel-collector-config.yaml",
        "--feature-gates=-pkg.translator.prometheus.NormalizeName",
      ]
    volumes:
      - ./infra/signoz/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=itau-challenge,deployment.environment=local
      - LOW_CARDINAL_EXCEPTION_GROUPING=false
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      clickhouse:
        condition: service_healthy
      otel-collector-migrator-sync:
        condition: service_completed_successfully
      query-service:
        condition: service_healthy
    restart: on-failure
