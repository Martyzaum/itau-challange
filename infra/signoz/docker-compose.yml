# SigNoz local stack (pinned). Used via root overlay docker-compose.signoz.yml.
# UI: http://localhost:3301  |  OTLP HTTP: localhost:4318  |  OTLP gRPC: localhost:4317
#
# nginx-config.conf is ONLY for the SigNoz frontend container (UI reverse-proxy),
# not for the balance API.

x-clickhouse-defaults: &clickhouse-defaults
  image: clickhouse/clickhouse-server:24.1.2-alpine
  restart: on-failure
  tty: true
  logging:
    options:
      max-size: 50m
      max-file: "3"
  healthcheck:
    test: ["CMD", "wget", "--spider", "-q", "0.0.0.0:8123/ping"]
    interval: 15s
    timeout: 5s
    retries: 10
  ulimits:
    nproc: 65535
    nofile:
      soft: 262144
      hard: 262144

services:
  zookeeper-1:
    image: bitnami/zookeeper:3.7.1
    user: root
    environment:
      - ZOO_SERVER_ID=1
      - ALLOW_ANONYMOUS_LOGIN=yes
      - ZOO_AUTOPURGE_INTERVAL=1
    volumes:
      - ./data/zookeeper-1:/bitnami/zookeeper
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 15s
      timeout: 5s
      retries: 10

  clickhouse:
    <<: *clickhouse-defaults
    hostname: clickhouse
    depends_on:
      zookeeper-1:
        condition: service_started
    volumes:
      - ./clickhouse-config.xml:/etc/clickhouse-server/config.xml:ro
      - ./clickhouse-users.xml:/etc/clickhouse-server/users.xml:ro
      - ./custom-function.xml:/etc/clickhouse-server/custom-function.xml:ro
      - ./clickhouse-cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./data/clickhouse/:/var/lib/clickhouse/
      - ./user_scripts:/var/lib/clickhouse/user_scripts/:ro

  otel-collector-migrator-sync:
    image: signoz/signoz-schema-migrator:0.111.24
    command: ["sync", "--dsn=tcp://clickhouse:9000", "--up="]
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: "no"

  otel-collector-migrator-async:
    image: signoz/signoz-schema-migrator:0.111.24
    command: ["async", "--dsn=tcp://clickhouse:9000", "--up="]
    depends_on:
      clickhouse:
        condition: service_healthy
      otel-collector-migrator-sync:
        condition: service_completed_successfully
    restart: "no"

  query-service:
    image: signoz/query-service:0.69.0
    command:
      [
        "-config=/root/config/prometheus.yml",
        "--use-logs-new-schema=true",
        "--use-trace-new-schema=true",
      ]
    volumes:
      - ./prometheus.yml:/root/config/prometheus.yml:ro
      - ./dashboards:/root/config/dashboards:ro
      - ./data/signoz/:/var/lib/signoz/
    environment:
      - ClickHouseUrl=tcp://clickhouse:9000
      - SIGNOZ_LOCAL_DB_PATH=/var/lib/signoz/signoz.db
      - DASHBOARDS_PATH=/root/config/dashboards
      - STORAGE=clickhouse
      - GODEBUG=netdns=go
      - TELEMETRY_ENABLED=false
      - DEPLOYMENT_TYPE=docker-standalone-amd
    depends_on:
      clickhouse:
        condition: service_healthy
      otel-collector-migrator-sync:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: on-failure

  # nginx config is required by this image (serves UI + proxies /api to query-service).
  frontend:
    image: signoz/frontend:0.69.0
    depends_on:
      query-service:
        condition: service_healthy
    ports:
      - "3301:3301"
    volumes:
      - ./nginx-config.conf:/etc/nginx/conf.d/default.conf:ro
    restart: on-failure

  otel-collector:
    image: signoz/signoz-otel-collector:0.111.24
    command:
      [
        "--config=/etc/otel-collector-config.yaml",
        "--manager-config=/etc/manager-config.yaml",
        "--copy-path=/var/tmp/collector-config.yaml",
        "--feature-gates=-pkg.translator.prometheus.NormalizeName",
      ]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
      - ./otel-collector-opamp-config.yaml:/etc/manager-config.yaml:ro
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=itau-challenge,deployment.environment=local
      - LOW_CARDINAL_EXCEPTION_GROUPING=false
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      clickhouse:
        condition: service_healthy
      otel-collector-migrator-sync:
        condition: service_completed_successfully
      query-service:
        condition: service_healthy
    restart: on-failure
